name: QA

on:
    - push

jobs:
    build_lint_test:
        runs-on: ubuntu-latest
        steps:
            -
                name: Begin QA...
                uses: actions/checkout@v4
            -
                name: Use Node 14
                uses: actions/setup-node@v4
                with:
                    node-version: 14.x
                    cache: yarn
            -
                name: Install dependencies
                env:
                    CI: true
                run: yarn install --frozen-lockfile
            -
                name: Build
                env:
                    CI: true
                run: yarn build
            -
                name: Lint
                env:
                    CI: true
                run: yarn lint
            -
                name: Test
                env:
                    CI: true
                run: yarn test
            -
                name: CodeCov
                uses: codecov/codecov-action@v4
                with:
                    token: ${{ secrets.CODECOV_TOKEN }}
                    files: ./log/coverage/coverage-final.json
                    flags: unit
                    fail_ci_if_error: false
